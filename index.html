<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8 Bit OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="welcome-screen">
        <div class="welcome-box">
            <!-- invisible char so the blue bar on top of welcome screen doesn't dissapear -->
            <div class="welcome-title-bar">ㅤ</div>
            <div class="welcome-content">
                <h1>8 Bit OS</h1>
                <p>A retro-inspired webOS</p>
                <button id="enter-os-btn">Enter</button>
            </div>
        </div>
    </div>

    <div id="desktop" class="hidden">
        <div class="icon" id="computer-icon">
            <div class="icon-box">PC</div>
            <p>My Computer</p>
        </div>
        <div class="icon" id="notepad-icon">
            <div class="icon-box">TXT</div>
            <p>Notepad</p>
        </div>
        <div class="icon" id="calc-icon">
            <div class="icon-box">CALC</div>
            <p>Calculator</p>
        </div>
        <div class="icon" id="paint-icon">
            <div class="icon-box">PAINT</div>
            <p>Paint</p>
        </div>

        <div id="window" class="window hidden">
            <div class="title-bar">
                <span id="explorer-title">My Computer</span>
                <button class="close-btn">X</button>
            </div>
            <div class="explorer-toolbar">
                <button id="explorer-back">← Back</button>
                <button id="explorer-up">↑ Up</button>
                <input type="text" id="explorer-address" readonly value="C:\">
            </div>
            <div class="explorer-body">
                <div class="explorer-sidebar">
                    <div class="sidebar-section">
                        <div class="sidebar-header">Places</div>
                        <div class="sidebar-item" data-path="C:\Documents">Documents</div>
                        <div class="sidebar-item" data-path="C:\Pictures">Pictures</div>
                        <div class="sidebar-item" data-path="C:\Wallpapers">Wallpapers</div>
                        <div class="sidebar-item" data-path="C:\Downloads">Downloads</div>
                    </div>
                </div>
                <div class="explorer-files" id="explorer-files-grid"></div>
            </div>
        </div>


        <div id="notepad-window" class="window hidden">
            <div class="title-bar">
                <span>Notepad</span>
                <button class="close-btn">X</button>
            </div>
            <div class="menu-bar">
                <div class="menu-dropdown-container">
                    <span class="menu-label" id="notepad-file-btn">File</span>
                    <div class="dropdown-menu hidden" id="notepad-file-menu">
                        <div class="dropdown-item" id="notepad-menu-save">Save As</div>
                    </div>
                </div>
            </div>
            <textarea class="notepad-textarea" placeholder="Type here..."></textarea>
        </div>


        <div id="calc-window" class="window hidden">
            <div class="title-bar">
                <span>Calculator</span>
                <button class="close-btn">X</button>
            </div>
            <div class="calc-body">
                <input type="text" id="calc-screen" readonly value="0">
                <div class="calc-grid">
                    <button class="calc-btn" data-value="7">7</button>
                    <button class="calc-btn" data-value="8">8</button>
                    <button class="calc-btn" data-value="9">9</button>
                    <button class="calc-btn op" data-value="/">/</button>
                    <button class="calc-btn" data-value="4">4</button>
                    <button class="calc-btn" data-value="5">5</button>
                    <button class="calc-btn" data-value="6">6</button>
                    <button class="calc-btn op" data-value="*">*</button>
                    <button class="calc-btn" data-value="1">1</button>
                    <button class="calc-btn" data-value="2">2</button>
                    <button class="calc-btn" data-value="3">3</button>
                    <button class="calc-btn op" data-value="-">-</button>
                    <button class="calc-btn" data-value="0">0</button>
                    <button class="calc-btn" id="calc-clear">C</button>
                    <button class="calc-btn op" data-value="=">=</button>
                    <button class="calc-btn op" data-value="+">+</button>
                </div>
            </div>
        </div>


        <div id="paint-window" class="window hidden">
            <div class="title-bar">
                <span>Paint</span>
                <button class="close-btn">X</button>
            </div>
            <div class="menu-bar">
                <div class="menu-dropdown-container">
                    <span class="menu-label" id="paint-file-btn">File</span>
                    <div class="dropdown-menu hidden" id="paint-file-menu">
                        <div class="dropdown-item" id="paint-menu-save">Save As</div>
                    </div>
                </div>
            </div>
            <div class="paint-body">
                <canvas id="paint-canvas" width="395" height="190"></canvas>
                <div class="paint-tools">
                    <div class="color-presets">
                        <button class="swatch" data-color="#000000" style="background:#000000;"></button>
                        <button class="swatch" data-color="#ffffff" style="background:#ffffff;"></button>
                        <button class="swatch" data-color="#ff0000" style="background:#ff0000;"></button>
                        <button class="swatch" data-color="#00ff00" style="background:#00ff00;"></button>
                        <button class="swatch" data-color="#0000ff" style="background:#0000ff;"></button>
                        <button class="swatch" data-color="#ffff00" style="background:#ffff00;"></button>
                        <button class="swatch" data-color="#ff00ff" style="background:#ff00ff;"></button>
                        <button class="swatch" data-color="#00ffff" style="background:#00ffff;"></button>
                    </div>
                    <input type="color" id="paint-color" value="#000000">
                    <button id="paint-clear">Clear</button>
                </div>
            </div>
        </div>


        <div id="save-modal" class="window hidden">
            <div class="title-bar">
                <span>Save As</span>
                <button class="close-btn" id="save-modal-close">X</button>
            </div>
            <div class="save-modal-body">
                <div class="save-field-row">
                    <label for="save-folder-select">Save in:</label>
                    <select id="save-folder-select">
                        <option value="C:\Documents">Documents</option>
                        <option value="C:\Pictures">Pictures</option>
                        <option value="C:\Wallpapers">Wallpapers</option>
                        <option value="C:\Downloads">Downloads</option>
                    </select>
                </div>
                <div class="save-field-row">
                    <label for="save-filename-input">File name:</label>
                    <input type="text" id="save-filename-input" value="untitled.txt">
                </div>
                <div class="save-modal-actions">
                    <button id="save-modal-confirm">Save</button>
                    <button id="save-modal-cancel">Cancel</button>
                </div>
            </div>
        </div>


        <div id="start-menu" class="hidden">
            <div class="menu-header">User</div>
            <div class="menu-item" id="menu-computer">My Computer</div>
            <div class="menu-item" id="menu-notepad">Notepad</div>
            <div class="menu-item" id="menu-calc">Calculator</div>
            <div class="menu-item" id="menu-paint">Paint</div>
        </div>


        <div class="taskbar">
            <button id="start-btn">start</button>
            <div class="time-display" id="clock">12:00 PM</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
